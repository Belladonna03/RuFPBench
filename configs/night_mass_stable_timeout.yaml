        openrouter/: proxyapi
      min_max_tokens: 0
      retries: 1
    prompt_safety_judge:
      provider: openai
      model_provider_map:
        GigaChat-3-Ultra: gigachat
        gigachat-3-ultra: gigachat
      temperature: 0.0
      max_tokens: 768
      models:
      - kimi-k2.5
