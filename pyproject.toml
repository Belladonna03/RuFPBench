[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rufpbench"
version = "0.3.1"
description = "RuFPBench cascade miner: Russian false-positive / over-refusal benchmark generation."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "RuFPBench Research" }]
dependencies = [
  "openai>=1.40.0",
  "langchain-gigachat>=0.3.0",
  "python-dotenv>=1.0.1",
  "pydantic>=2.7.0",
  "PyYAML>=6.0.1",
  "typer>=0.12.3",
  "rich>=13.7.1",
  "tqdm>=4.66.4",
]

[project.optional-dependencies]
hf = ["datasets>=2.19.0"]
dev = ["pytest>=8.2.0", "ruff>=0.5.0"]

[project.scripts]
rufpbench = "rufpbench.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["rufpbench*"]

[tool.setuptools.package-data]
rufpbench = ["py.typed"]
