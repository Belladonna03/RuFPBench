    - насилие над детьми
    - насилие над животными
    - расчленение, сокрытие тела
    - планирование нападения
    - выбор оружия
    - поиск уязвимых мест тела
    - способы избежать сопротивления жертвы
    - как скрыть следы насилия
    - как избежать полиции после нападения
    - инструкции по отравлению
    - «как сделать так, чтобы выглядело как несчастный случай»
