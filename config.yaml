output_dir: data/raw
request_timeout_s: 30
user_agent: ru-fpbench-data-collector/0.1 (course assignment)
save_per_source: true
save_merged: true
max_rows_per_source: 500
project:
  name: ru_fp_bench_data_collection
  task_type: text_classification
  output_dir: data/raw
  random_seed: 42

llm:
  api_key_env: PROXYAPI_API_KEY
  base_url: https://openai.api.proxyapi.ru/v1
  model: openrouter/qwen/qwen3-32b
  timeout_s: 120
  max_retries: 3
  retry_sleep: 2.0

data_collection:
  save_per_source: true
  save_merged: true
  merged_filename: collected_merged.csv
  max_rows_per_source: null

  standard_columns:
    - text
    - label
    - source
    - collected_at
    - source_type
    - split
    - language
    - meta

  sources:
    # -----------------------------
    # ПУЛ 1 — ОСНОВНЫЕ ДОНОРЫ
    # -----------------------------

    - name: reward_bench_xstest_should_respond
      type: hf_dataset
      hf_dataset_name: allenai/reward-bench
      subset: xstest-should-respond
      split: filtered
      text_field: prompt
      label: benign_fp_seed
      source_type: hf
      language: en
      role: primary_donor
      enabled: true

    - name: rus_context_bench
      type: hf_dataset
      hf_dataset_name: askatasuna/RusConTextBench
      # если агент умеет подмножества/конфиги HF:
      # subset: idiom
      split: train
      text_field: text
      label: benign_fp_seed
      source_type: hf
      language: ru
      role: primary_donor
      enabled: true

    - name: slavic_fixed_expressions
      type: hf_dataset
      hf_dataset_name: izaitova/slavic_fixed_expressions
      split: train
      text_field: text
      label: benign_fp_seed
      source_type: hf
      language: ru
      role: primary_donor
      enabled: true

    - name: masterrussian_idioms
      type: scrape
      url: https://masterrussian.com/idioms/russian_idioms.htm
      selector: "table tr, .entry, .article, li"
      source_type: scrape
      language: ru
      label: benign_fp_seed
      role: primary_donor
      enabled: true

    - name: verymuchrussian_idioms
      type: scrape
      url: https://verymuchrussian.com/russian-idioms/
      selector: "article p, article li, .entry-content p, .entry-content li"
      source_type: scrape
      language: ru
      label: benign_fp_seed
      role: primary_donor
      enabled: true

    - name: golearnrussian_idioms
      type: scrape
      url: https://golearnrussian.com/idiomy-russkogo-yazyka/
      selector: "article p, article li, .entry-content p, .entry-content li"
      source_type: scrape
      language: ru
      label: benign_fp_seed
      role: primary_donor
      enabled: true

    # -----------------------------
    # ПУЛ 2 — КОНТРАСТ / SYNTHETIC DONORS
    # -----------------------------

    - name: reward_bench_xstest_should_refuse
      type: hf_dataset
      hf_dataset_name: allenai/reward-bench
      subset: xstest-should-refuse
      split: filtered
      text_field: prompt
      label: contrast_refuse
      source_type: hf
      language: en
      role: contrast_donor
      enabled: true

    - name: phtest
      type: hf_dataset
      hf_dataset_name: furonghuang-lab/PHTest
      split: train
      text_field: prompt
      label: synthetic_contrast
      source_type: hf
      language: en
      role: synthetic_donor
      enabled: true

    # OKTest: лучше подключить как локальный CSV/JSONL,
    # пока ты не зафиксируешь официальный machine-readable source.
    - name: oktest_local
      type: local_file
      path: data/external/oktest.csv
      file_format: csv
      text_field: prompt
      label: synthetic_contrast
      source_type: local
      language: en
      role: synthetic_donor
      enabled: false

    - name: russian_language_toxic_comments
      type: kaggle_dataset
      kaggle_dataset_name: blackmoon/russian-language-toxic-comments
      text_field: comment
      label_field: toxic
      label: synthetic_contrast
      source_type: kaggle
      language: ru
      role: synthetic_donor
      enabled: true

    - name: toxic_russian_comments
      type: kaggle_dataset
      kaggle_dataset_name: alexandersemiletov/toxic-russian-comments
      text_field: comment
      label_field: toxic
      label: synthetic_contrast
      source_type: kaggle
      language: ru
      role: synthetic_donor
      enabled: true
appendix_rewrite:
  enabled: false
  mode: hybrid
  language: ru
  input_seed_roles:
  - unsafe_donor_ru
  - unsafe_donor
  skip_seed_roles:
  - native_ru_seed
  output_seed_role: candidate_benign_borderline
  output_label: candidate_benign_borderline
  output_source_suffix: :appendix
  keep_original: true
  max_inputs: 300
  n_variants_per_input: 2
  random_seed: 42
  llm:
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    model: gpt-4o-mini
    temperature: 0.4
    max_tokens: 240
    timeout_s: 60
quality:
  strategy:
    missing: fill
    duplicates: drop
    outliers: drop_iqr
  duplicate_subset:
  - text
  outlier_k: 1.5
annotation:
  task: ru_fpbench_borderline_prompt_classification
  confidence_threshold: 0.7
  include_predictions: true
hitl:
  review_queue_path: data/labeled/review_queue.csv
  corrected_queue_path: data/labeled/review_queue_corrected.csv
  human_mode: stop_if_missing
active_learning:
  enabled: true
  start_n: 50
  n_iterations: 5
  batch_size: 20
  strategies:
  - entropy
  - random
  metric: f1
  test_size: 0.2
  random_state: 42
training:
  enabled: true
  test_size: 0.2
  random_state: 42
  model: logreg
  output_model_path: models/baseline_logreg.pkl
reporting:
  enabled: true
  final_dataset_path: data/labeled/final_dataset.parquet
  final_dataset_csv: data/labeled/final_dataset.csv
al_select:
  enabled: true
  strategy: entropy
  batch_size: 100
  output_csv: data/labeled/al_candidates.csv
  output_labelstudio: data/labeled/al_candidates_labelstudio.json
